<title>积木工坊</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=ZCOOL+KuaiLe&family=Nunito:wght@700;900&display=swap">
<style>
/* Layout: full-bleed 3D table; glassy toy-box HUD floats at the corners, parts tray docked at the bottom. */
:root{
  --panel: rgba(22,26,44,.74);
  --panel-hi: rgba(255,255,255,.10);
  --line: rgba(255,255,255,.14);
  --ink: #fbf7ee;
  --muted: #b4bbd3;
  --accent: #ffc934;
  --accent-ink: #2b1f00;
  --danger: #ff5d4f;
  --good: #63e08a;
  --sky-top: #6fb8f0;
  --sky-low: #dff1ff;
  --display: 'ZCOOL KuaiLe', 'Nunito', 'PingFang SC', 'Microsoft YaHei', sans-serif;
  --ui: 'Nunito', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', system-ui, sans-serif;
  color-scheme: dark;
}
[hidden] { display: none !important; }
*, *::before, *::after { box-sizing: border-box; }
html, body { height: 100%; margin: 0; overflow: hidden; }
body {
  background: linear-gradient(180deg, var(--sky-top) 0%, var(--sky-low) 62%, #cfe6c9 100%);
  color: var(--ink); font-family: var(--ui); font-size: 14px;
  -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent;
  transition: background 1.2s ease;
}
body.night { background: linear-gradient(180deg, #070b1d 0%, #1a2350 60%, #22305a 100%); }
#stars { position: fixed; inset: 0; pointer-events: none; opacity: 0; transition: opacity 1.2s; }
body.night #stars { opacity: 1; }
#stage { position: fixed; inset: 0; }
#stage canvas { display: block; outline: none; }

button { font: inherit; color: inherit; cursor: pointer; border: 0; background: none; }
button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.glass { background: var(--panel); border: 1px solid var(--line); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); border-radius: 16px; box-shadow: 0 8px 28px rgba(10,14,30,.25); }

/* top-left: brand + blueprint */
#tl { position: fixed; top: calc(12px + env(safe-area-inset-top,0px)); left: max(16px, env(safe-area-inset-left,0px)); display: flex; flex-direction: column; gap: 8px; width: min(250px, 46vw); }
.brand { font-family: var(--display); font-size: 28px; line-height: 1; letter-spacing: 1px; display: flex; align-items: center; gap: 8px; text-shadow: 0 2px 0 rgba(0,0,0,.25); }
.brand i { width: 26px; height: 18px; background: var(--danger); border-radius: 3px; position: relative; display: inline-block; box-shadow: inset 0 -4px 0 rgba(0,0,0,.2); flex: none; }
.brand i::before, .brand i::after { content: ""; position: absolute; top: -5px; width: 8px; height: 6px; border-radius: 2px 2px 0 0; background: var(--danger); }
.brand i::before { left: 3px; } .brand i::after { right: 3px; }
#bp { padding: 10px 12px; display: flex; flex-direction: column; gap: 6px; }
#bp .row { display: flex; align-items: center; gap: 6px; }
#bp .label, #quests .label { font-size: 11px; letter-spacing: .12em; color: var(--muted); text-transform: uppercase; }
#bp .name { font-family: var(--display); font-size: 18px; flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
#bp .nav { width: 26px; height: 26px; border-radius: 8px; background: var(--panel-hi); display: grid; place-items: center; font-weight: 900; }
.bar { height: 8px; border-radius: 99px; background: rgba(255,255,255,.12); overflow: hidden; }
.bar > b { display: block; height: 100%; width: 0; border-radius: inherit; background: linear-gradient(90deg, #5fd6ff, #8affc1); transition: width .35s cubic-bezier(.2,.9,.3,1.2); }
#bp .meta { font-size: 12px; color: var(--muted); display: flex; justify-content: space-between; font-variant-numeric: tabular-nums; }
#bp.done .bar > b { background: linear-gradient(90deg, var(--accent), #ffe58a); }

#quests { padding: 10px 12px; display: flex; flex-direction: column; gap: 8px; }
#quests .head { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 0; width: 100%; text-align: left; }
#quests .label b { color: var(--ink); font-variant-numeric: tabular-nums; }
#quests .streak { font-size: 12px; color: var(--accent); font-weight: 900; white-space: nowrap; }
#quests .chev { color: var(--muted); font-weight: 900; transition: transform .2s; }
#quests.closed .chev { transform: rotate(-90deg); }
#qList { display: flex; flex-direction: column; gap: 8px; }
#quests.closed #qList { display: none; }
.quest { display: flex; flex-direction: column; gap: 4px; }
.quest .qrow { display: flex; justify-content: space-between; gap: 8px; font-size: 12.5px; }
.quest .qrow span:last-child { color: var(--muted); font-variant-numeric: tabular-nums; flex: none; }
.quest .bar { height: 5px; }
.quest.done .qrow span:first-child { text-decoration: line-through; color: var(--muted); }
.quest.done .bar > b { background: linear-gradient(90deg, var(--good), #b5ffcf); }
.stats-line { font-size: 12.5px; }

/* top-right: level */
#tr { position: fixed; top: calc(12px + env(safe-area-inset-top,0px)); right: max(16px, env(safe-area-inset-right,0px)); width: min(230px, 44vw); padding: 10px 12px; display: flex; flex-direction: column; gap: 6px; }
#tr .row { display: flex; align-items: center; gap: 10px; }
.lv { font-family: var(--display); font-size: 22px; background: var(--accent); color: var(--accent-ink); border-radius: 10px; padding: 2px 9px; box-shadow: inset 0 -3px 0 rgba(0,0,0,.18); font-variant-numeric: tabular-nums; }
.lv.pop { animation: pop .6s cubic-bezier(.2,1.6,.4,1); }
#tr .title { font-weight: 900; font-size: 13px; line-height: 1.2; }
#tr .sub { font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
#xpbar > b { background: linear-gradient(90deg, #ffb020, var(--accent)); }
#achBtn { font-size: 12px; color: var(--muted); text-align: left; padding: 0; }
#achBtn b { color: var(--ink); }

/* right: tools */
#tools { position: fixed; right: max(16px, env(safe-area-inset-right,0px)); top: 50%; transform: translateY(-50%); display: flex; flex-direction: column; gap: 6px; padding: 6px; }
.tool { width: 44px; height: 44px; border-radius: 12px; display: grid; place-items: center; position: relative; transition: background .15s, transform .1s; }
.tool:hover { background: var(--panel-hi); }
.tool:active { transform: scale(.92); }
.tool.on { background: var(--danger); }
.tool.on.alt { background: var(--accent); color: var(--accent-ink); }
.tool svg { width: 22px; height: 22px; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.tool[data-tip]:hover::after { content: attr(data-tip); position: absolute; right: 52px; white-space: nowrap; background: rgba(10,12,24,.9); padding: 4px 8px; border-radius: 8px; font-size: 12px; pointer-events: none; }
.tool:disabled { opacity: .35; }

/* bottom tray */
#tray { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(12px + env(safe-area-inset-bottom,0px)); width: min(820px, calc(100vw - 32px - env(safe-area-inset-left,0px) - env(safe-area-inset-right,0px))); padding: 8px; display: flex; flex-direction: column; gap: 6px; }
.strip { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; padding: 2px; }
.strip::-webkit-scrollbar { display: none; }
.part { flex: none; min-width: 64px; height: 62px; border-radius: 12px; background: var(--panel-hi); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; position: relative; padding: 0 6px; transition: transform .12s, background .15s; }
.part:hover { transform: translateY(-2px); }
.part.sel { background: rgba(255,201,52,.22); box-shadow: inset 0 0 0 2px var(--accent); }
.part span { font-size: 11px; font-weight: 700; color: var(--muted); white-space: nowrap; }
.part.sel span { color: var(--ink); }
.part svg { display: block; max-height: 32px; }
.part kbd { position: absolute; top: 3px; left: 5px; font: 700 9px var(--ui); color: var(--muted); opacity: .7; }
.locked { opacity: .5; }
.locked::after { content: attr(data-lv); position: absolute; inset: 0; display: grid; place-items: center; background: rgba(8,10,22,.55); border-radius: inherit; font: 900 12px var(--ui); color: var(--ink); }
.unlocked-now { animation: pop .8s cubic-bezier(.2,1.6,.4,1) 3; }
.swatch { flex: none; width: 36px; height: 36px; border-radius: 10px; position: relative; box-shadow: inset 0 -4px 0 rgba(0,0,0,.22), inset 0 0 0 1px rgba(255,255,255,.18); transition: transform .12s; }
.swatch:hover { transform: translateY(-2px); }
.swatch.sel { box-shadow: inset 0 -4px 0 rgba(0,0,0,.22), 0 0 0 2px var(--panel), 0 0 0 4px var(--accent); }
.swatch.locked::after { font-size: 9px; }
.swatch.glass { background-image: linear-gradient(135deg, rgba(255,255,255,.55), rgba(255,255,255,0) 60%) !important; }
.swatch.glow { box-shadow: 0 0 12px #7dfcff, inset 0 -4px 0 rgba(0,0,0,.22); }

/* toasts, combo, floaters */
#toasts { position: fixed; top: calc(14px + env(safe-area-inset-top,0px)); left: 50%; transform: translateX(-50%); display: flex; flex-direction: column; align-items: center; gap: 6px; pointer-events: none; z-index: 20; width: min(360px, calc(100vw - 32px)); }
.toast { padding: 9px 14px; display: flex; align-items: center; gap: 10px; animation: toastIn .45s cubic-bezier(.2,1.4,.4,1); max-width: 100%; }
.toast .ic { width: 30px; height: 30px; border-radius: 9px; display: grid; place-items: center; background: var(--accent); color: var(--accent-ink); font-family: var(--display); font-size: 17px; flex: none; }
.toast b { display: block; font-family: var(--display); font-size: 16px; font-weight: 400; }
.toast small { color: var(--muted); font-size: 12px; }
.toast.out { animation: toastOut .35s ease forwards; }
#combo { position: fixed; top: 34%; left: 50%; transform: translate(-50%,-50%); font-family: var(--display); font-size: 40px; color: var(--accent); text-shadow: 0 3px 0 #b36b00, 0 6px 18px rgba(0,0,0,.35); pointer-events: none; opacity: 0; transition: opacity .4s; }
#combo.show { opacity: 1; }
#combo.bump { animation: pop .3s cubic-bezier(.2,1.8,.4,1); }
.floater { position: fixed; pointer-events: none; font: 900 16px var(--ui); color: #fff; text-shadow: 0 2px 0 rgba(0,0,0,.35), 0 0 8px rgba(0,0,0,.25); animation: floatUp 1s ease-out forwards; z-index: 15; white-space: nowrap; }

/* tips & modals */
#tip { position: fixed; left: max(16px, env(safe-area-inset-left,0px)); bottom: calc(160px + env(safe-area-inset-bottom,0px)); padding: 10px 12px; max-width: min(300px, calc(100vw - 100px)); font-size: 12.5px; line-height: 1.6; color: var(--muted); }
#tip b { color: var(--ink); }
#tip button { margin-top: 6px; font-weight: 900; color: var(--accent); padding: 0; }
.modal { position: fixed; inset: 0; background: rgba(6,8,18,.55); display: grid; place-items: center; z-index: 30; padding: 16px; }
.modal .card { width: min(460px, 100%); max-height: 80vh; overflow: auto; padding: 18px; display: flex; flex-direction: column; gap: 12px; background: var(--panel); }
.modal h2 { margin: 0; font-family: var(--display); font-weight: 400; font-size: 24px; }
.modal p { margin: 0; color: var(--muted); line-height: 1.6; }
.btns { display: flex; gap: 8px; justify-content: flex-end; flex-wrap: wrap; }
.btn { padding: 9px 16px; border-radius: 11px; background: var(--panel-hi); font-weight: 900; }
.btn.primary { background: var(--accent); color: var(--accent-ink); }
.btn.danger { background: var(--danger); color: #fff; }
.achs { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.ach { padding: 10px; border-radius: 12px; background: var(--panel-hi); display: flex; flex-direction: column; gap: 2px; }
.ach b { font-family: var(--display); font-weight: 400; font-size: 15px; }
.ach small { color: var(--muted); font-size: 11.5px; line-height: 1.4; }
.ach.off { opacity: .45; }
.ach.on { box-shadow: inset 0 0 0 1.5px var(--accent); }
.keys { display: grid; grid-template-columns: auto 1fr; gap: 6px 14px; font-size: 13px; }
.keys kbd { font: 900 12px var(--ui); background: var(--panel-hi); border-radius: 6px; padding: 2px 7px; justify-self: start; }
.keys span { color: var(--muted); }

@keyframes pop { 0% { transform: scale(1); } 40% { transform: scale(1.35); } 100% { transform: scale(1); } }
@keyframes toastIn { from { opacity: 0; transform: translateY(-14px) scale(.9); } to { opacity: 1; transform: none; } }
@keyframes toastOut { to { opacity: 0; transform: translateY(-10px); } }
@keyframes floatUp { from { opacity: 1; transform: translate(-50%, 0) scale(.9); } 20% { transform: translate(-50%, -14px) scale(1.15); } to { opacity: 0; transform: translate(-50%, -54px) scale(1); } }

@media (max-width: 560px) {
  #tl, #tr { width: calc(50vw - 22px); }
  .brand { font-size: 22px; }
  #bp .name { font-size: 15px; }
  #tr .title { display: none; }
  #tools { top: auto; bottom: calc(150px + env(safe-area-inset-bottom,0px)); transform: none; }
  .tool { width: 40px; height: 40px; }
  .tool[data-tip]:hover::after { display: none; }
  .part { min-width: 56px; height: 54px; }
  #tip { bottom: calc(150px + env(safe-area-inset-bottom,0px)); max-width: calc(100vw - 100px); }
  #combo { font-size: 32px; }
}
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation-duration: .01ms !important; transition-duration: .01ms !important; } }
</style>

<div id="stars"></div>
<div id="stage"></div>

<div id="tl">
  <div class="brand"><i></i>积木工坊</div>
  <div id="bp" class="glass">
    <div class="row"><span class="label">图纸</span></div>
    <div class="row">
      <button class="nav" id="bpPrev" aria-label="上一张图纸">‹</button>
      <div class="name" id="bpName">阶梯金字塔</div>
      <button class="nav" id="bpNext" aria-label="下一张图纸">›</button>
    </div>
    <div class="bar"><b id="bpFill"></b></div>
    <div class="meta"><span id="bpDesc">把蓝色虚影填满</span><span id="bpCount">0/0</span></div>
  </div>
  <div id="quests" class="glass">
    <button class="head" id="qHead" aria-expanded="true"><span class="label">今日任务 <b id="qCount">0/3</b></span><span><span class="streak" id="streak"></span> <span class="chev">▾</span></span></button>
    <div id="qList"></div>
  </div>
</div>

<div id="tr" class="glass">
  <div class="row">
    <div class="lv" id="lv">Lv.1</div>
    <div style="min-width:0">
      <div class="title" id="rank">见习搭建师</div>
      <div class="sub" id="xpText">0 / 70 XP</div>
    </div>
  </div>
  <div class="bar" id="xpbar"><b id="xpFill"></b></div>
  <div class="sub" id="stats">已搭 0 块 · 最高 0 层</div>
  <button id="achBtn">成就 <b id="achCount">0/0</b> ›</button>
</div>

<div id="tools" class="glass">
  <button class="tool" id="tRotate" data-tip="旋转积木 (R)" aria-label="旋转积木"><svg viewBox="0 0 24 24"><path d="M20 12a8 8 0 1 1-2.34-5.66"/><path d="M20 4v5h-5"/></svg></button>
  <button class="tool" id="tErase" data-tip="拆除模式 (E)" aria-label="拆除模式"><svg viewBox="0 0 24 24"><path d="M7 21h10"/><path d="M5 7h14l-1.2 11.2A2 2 0 0 1 15.8 20H8.2a2 2 0 0 1-2-1.8z"/><path d="M9 7V4h6v3"/></svg></button>
  <button class="tool" id="tPaint" data-tip="刷色模式 (P)" aria-label="刷色模式"><svg viewBox="0 0 24 24"><path d="M4 4h12v5H4z"/><path d="M16 6.5h3v5h-8v3"/><path d="M10 14.5h2v6h-2z"/></svg></button>
  <button class="tool" id="tUndo" data-tip="撤销 (Ctrl+Z)" aria-label="撤销"><svg viewBox="0 0 24 24"><path d="M9 14 4 9l5-5"/><path d="M4 9h10a6 6 0 0 1 0 12h-3"/></svg></button>
  <button class="tool" id="tRedo" data-tip="重做 (Ctrl+Y)" aria-label="重做"><svg viewBox="0 0 24 24"><path d="m15 14 5-5-5-5"/><path d="M20 9H10a6 6 0 0 0 0 12h3"/></svg></button>
  <button class="tool" id="tBp" data-tip="显示/隐藏图纸 (B)" aria-label="显示或隐藏图纸"><svg viewBox="0 0 24 24"><path d="M3 5h18v14H3z"/><path d="M3 10h18M9 5v14"/></svg></button>
  <button class="tool" id="tNight" data-tip="白天/夜晚 (N)" aria-label="切换白天夜晚"><svg viewBox="0 0 24 24"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg></button>
  <button class="tool" id="tSound" data-tip="声音 (M)" aria-label="声音开关"><svg viewBox="0 0 24 24"><path d="M11 5 6 9H3v6h3l5 4z"/><path d="M15.5 8.5a5 5 0 0 1 0 7M18.5 5.5a9 9 0 0 1 0 13"/></svg></button>
  <button class="tool" id="tHelp" data-tip="操作说明 (H)" aria-label="操作说明"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M9.5 9a2.5 2.5 0 1 1 3.5 2.3c-.6.3-1 .9-1 1.6V14"/><path d="M12 17.5v.01"/></svg></button>
  <button class="tool" id="tClear" data-tip="清空场景" aria-label="清空场景"><svg viewBox="0 0 24 24"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"/></svg></button>
</div>

<div id="tray" class="glass">
  <div class="strip" id="parts"></div>
  <div class="strip" id="colors"></div>
</div>

<div id="tip" class="glass" hidden></div>
<div id="toasts"></div>
<div id="combo">连击 ×2</div>
<div id="modal" class="modal" hidden><div class="card glass" id="modalCard"></div></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/utils/BufferGeometryUtils.js"></script>
<script>
(() => {
'use strict';
/* ================= data ================= */
const PH = 0.4;          // one plate of height, in world units (a brick = 3 plates)
const HALF = 16;         // baseplate is 32 x 32 studs
const MAXY = 180;        // max height in plates
const SAVE_KEY = 'brick-workshop.v1';

const TYPES = [
  { id:'b11', name:'1×1',   w:1, d:1, h:3, kind:'brick' },
  { id:'b12', name:'1×2',   w:2, d:1, h:3, kind:'brick' },
  { id:'b22', name:'2×2',   w:2, d:2, h:3, kind:'brick' },
  { id:'b24', name:'2×4',   w:4, d:2, h:3, kind:'brick' },
  { id:'p12', name:'薄板 1×2', w:2, d:1, h:1, kind:'plate' },
  { id:'b14', name:'1×4',   w:4, d:1, h:3, kind:'brick' },
  { id:'s22', name:'斜坡 2×2', w:2, d:2, h:3, kind:'slope' },
  { id:'p22', name:'薄板 2×2', w:2, d:2, h:1, kind:'plate' },
  { id:'b23', name:'2×3',   w:3, d:2, h:3, kind:'brick' },
  { id:'p44', name:'薄板 4×4', w:4, d:4, h:1, kind:'plate' },
  { id:'s12', name:'斜坡 1×2', w:1, d:2, h:3, kind:'slope' },
  { id:'b16', name:'1×6',   w:6, d:1, h:3, kind:'brick' },
  { id:'p11', name:'薄板 1×1', w:1, d:1, h:1, kind:'plate' },
  { id:'p24', name:'薄板 2×4', w:4, d:2, h:1, kind:'plate' },
];
const T = Object.fromEntries(TYPES.map(t => [t.id, t]));

const COLORS = [
  { id:'red',    name:'砖红',   hex:0xc91a09 },
  { id:'blue',   name:'宝蓝',   hex:0x0b5cc4 },
  { id:'yellow', name:'明黄',   hex:0xf5cd2f },
  { id:'white',  name:'象牙白', hex:0xf2f2ee },
  { id:'black',  name:'炭黑',   hex:0x23252b },
  { id:'green',  name:'森林绿', hex:0x23843f },
  { id:'orange', name:'橘橙',   hex:0xfe8a18 },
  { id:'lime',   name:'青柠',   hex:0xaed11b },
  { id:'purple', name:'葡萄紫', hex:0x7a3fa8 },
  { id:'lgrey',  name:'浅灰',   hex:0xa3a8ad },
  { id:'pink',   name:'樱花粉', hex:0xf79bb8 },
  { id:'azure',  name:'湖水蓝', hex:0x36aed0 },
  { id:'tan',    name:'沙土',   hex:0xe2c995 },
  { id:'glass',  name:'透明',   hex:0xa8dcff, special:'glass' },
  { id:'brown',  name:'胡桃棕', hex:0x6b4128 },
  { id:'dgrey',  name:'深灰',   hex:0x5f6266 },
  { id:'gold',   name:'鎏金',   hex:0xd8a838, special:'gold' },
  { id:'glow',   name:'夜光',   hex:0x7dfcff, special:'glow' },
];
const C = Object.fromEntries(COLORS.map(c => [c.id, c]));

const BASE_UNLOCKED = new Set(['b11','b12','b22','b24','red','blue','yellow','white','black','green']);

function genPyramid() { const c = []; for (let k = 0; k < 4; k++) for (let x = -3 + k; x <= 3 - k; x++) for (let z = -3 + k; z <= 3 - k; z++) c.push([x, k, z]); return c; }
function genTower() {
  const c = []; const ring = [];
  for (let x = -2; x <= 1; x++) for (let z = -2; z <= 1; z++) if (x === -2 || x === 1 || z === -2 || z === 1) ring.push([x, z]);
  for (let k = 0; k < 8; k++) ring.forEach(([x, z]) => { if (k < 2 && z === 1 && (x === -1 || x === 0)) return; c.push([x, k, z]); });
  ring.forEach(([x, z], i) => { if ((x + z) % 2 === 0) c.push([x, 8, z]); });
  return c;
}
function genCabin() {
  const c = [];
  for (let k = 0; k < 4; k++) for (let x = -4; x <= 3; x++) for (let z = -3; z <= 2; z++) {
    const edge = x === -4 || x === 3 || z === -3 || z === 2; if (!edge) continue;
    if (z === 2 && (x === -1 || x === 0) && k < 3) continue;           // door
    if ((x === -4 || x === 3) && z >= -1 && z <= 0 && k === 2) continue; // windows
    c.push([x, k, z]);
  }
  const roof = [[-3, 2], [-2, 1], [-1, 0]];
  roof.forEach(([z0, z1], i) => { for (let x = -4; x <= 3; x++) for (let z = z0; z <= z1; z++) c.push([x, 4 + i, z]); });
  return c;
}
function genBridge() {
  const c = [];
  for (let k = 0; k < 3; k++) for (let x of [-6, -5, 4, 5]) for (let z = -1; z <= 0; z++) c.push([x, k, z]);
  for (let x = -6; x <= 5; x++) for (let z = -1; z <= 0; z++) c.push([x, 3, z]);
  for (let x = -6; x <= 5; x += 1) if (x % 2 === 0) { c.push([x, 4, -1]); c.push([x, 4, 0 + 0]); }

}

}
function genCastle() {

/* geometry & materials */
const geoCache = {};
function brickGeo(id) {
  if (geoCache[id]) return geoCache[id];
  const t = T[id]; const W = t.w, D = t.d, H = t.h * PH, g = 0.025;
  const parts = [];
  const stud = (cx, cz) => { const s = studGeo.clone(); s.translate(cx, H + 0.085, cz); parts.push(s.toNonIndexed()); };
  if (t.kind !== 'slope') {
    const b = new THREE.BoxGeometry(W - g * 2, H - 0.01, D - g * 2); b.translate(0, (H - 0.01) / 2, 0); parts.push(b.toNonIndexed());
    for (let i = 0; i < W; i++) for (let j = 0; j < D; j++) stud(-W / 2 + i + 0.5, -D / 2 + j + 0.5);
  } else {
    const s = new THREE.Shape();
    s.moveTo(g, 0); s.lineTo(2 - g, 0); s.lineTo(2 - g, 0.16); s.lineTo(1, H - 0.01); s.lineTo(g, H - 0.01); s.lineTo(g, 0);
    const e = new THREE.ExtrudeGeometry(s, { depth: W - g * 2, bevelEnabled: false });
    const m = new THREE.Matrix4(); m.set(0, 0, 1, -(W - g * 2) / 2, 0, 1, 0, 0, -1, 0, 0, 1, 0, 0, 0, 1);
    e.applyMatrix4(m);
    parts.push(e.index ? e.toNonIndexed() : e);
    for (let i = 0; i < W; i++) stud(-W / 2 + i + 0.5, 0.5);
  }
  const merged = THREE.BufferGeometryUtils.mergeBufferGeometries(parts, false);
  merged.computeBoundingSphere();
  return (geoCache[id] = merged);
}
const matCache = {};
function brickMat(cid) {
  if (matCache[cid]) return matCache[cid];
  const c = C[cid]; let m;
  if (c.special === 'glass') m = new THREE.MeshPhysicalMaterial({ color: lin(c.hex), transparent: true, opacity: 0.42, roughness: 0.05, metalness: 0, clearcoat: 1, depthWrite: false });
  else if (c.special === 'gold') m = new THREE.MeshStandardMaterial({ color: lin(c.hex), metalness: 0.9, roughness: 0.25, envMapIntensity: 1.4 });
  else if (c.special === 'glow') m = new THREE.MeshStandardMaterial({ color: lin(c.hex), emissive: lin(c.hex), emissiveIntensity: 0.55, roughness: 0.35 });
  else m = new THREE.MeshPhysicalMaterial({ color: lin(c.hex), roughness: 0.3, metalness: 0, clearcoat: 0.35, clearcoatRoughness: 0.3, envMapIntensity: 0.6 });
  return (matCache[cid] = m);
}

const bricks = new Map(); let nextId = 1;
const occ = new Map(); const pickables = [];
const key = (x, y, z) => x + ',' + y + ',' + z;
const dims = (t, rot) => rot % 2 ? [t.d, t.w] : [t.w, t.d];
function cellsOf(type, rot, x, y, z) {
  const t = T[type]; const [W, D] = dims(t, rot); const out = [];
  for (let i = 0; i < W; i++) for (let j = 0; j < D; j++) for (let k = 0; k < t.h; k++) out.push(key(x + i, y + k, z + j));
  return out;
}
function fits(type, rot, x, y, z) {
  const t = T[type]; const [W, D] = dims(t, rot);
  if (x < -HALF || z < -HALF || x + W > HALF || z + D > HALF || y < 0 || y + t.h > MAXY) return false;
  return cellsOf(type, rot, x, y, z).every(k => !occ.has(k));
}
function addBrick(d, animate) {
  const b = { id: nextId++, type: d.type, color: d.color, rot: d.rot, x: d.x, y: d.y, z: d.z };
  const t = T[b.type]; const [W, D] = dims(t, b.rot);
  const mesh = new THREE.Mesh(brickGeo(b.type), brickMat(b.color));
  mesh.position.set(b.x + W / 2, b.y * PH, b.z + D / 2);
  mesh.rotation.y = -b.rot * Math.PI / 2;
  mesh.castShadow = true; mesh.receiveShadow = true;
  mesh.userData.id = b.id;
  scene.add(mesh); b.mesh = mesh;
  bricks.set(b.id, b); pickables.push(mesh);
  cellsOf(b.type, b.rot, b.x, b.y, b.z).forEach(k => occ.set(k, b.id));
  if (animate) anims.push({ mesh, t0: performance.now(), dur: 230, to: mesh.position.y, from: mesh.position.y + 0.9 });
  return b;
}
function removeBrick(id) {
  const b = bricks.get(id); if (!b) return null;
  scene.remove(b.mesh);
  pickables.splice(pickables.indexOf(b.mesh), 1);
  cellsOf(b.type, b.rot, b.x, b.y, b.z).forEach(k => occ.delete(k));
  bricks.delete(id);
  return b;
}

function audio() {

function tone(a, t, freq, type, dur, vol, endFreq) {

  o.type = type; o.frequency.setValueAtTime(freq, t); if (endFreq) o.frequency.exponentialRampToValueAtTime(endFreq, t + dur);
  g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  o.connect(g).connect(a.destination); o.start(t); o.stop(t + dur + 0.02);
}

}

}

}

const undoStack = [], redoStack = [];
function place() {
  updateHover();
  if (!placement) return;
  const d = { type: state.type, color: state.color, rot: state.rot, ...placement };
  const b = addBrick(d, true);
  undoStack.push({ op: 'add', d }); redoStack.length = 0; if (undoStack.length > 300) undoStack.shift();
  onPlaced(b); afterChange(true);
}
function erase(id) {
  const b = removeBrick(id); if (!b) return;
  undoStack.push({ op: 'del', d: snap(b) }); redoStack.length = 0;
  sRemove(); burst(b.mesh.position.clone().add(new THREE.Vector3(0, 0.4, 0)), 10, false);
  prog.removed++; checkAchs(); afterChange(true);
}
function recolor(b, c) { b.color = c; b.mesh.material = brickMat(c); }
function paint(id) {
  const b = bricks.get(id); if (!b || b.color === state.color) return;
  const from = b.color; recolor(b, state.color);
  undoStack.push({ op: 'paint', d: { x: b.x, y: b.y, z: b.z }, from, to: state.color }); redoStack.length = 0;
  sClick(1.35); burst(b.mesh.position.clone().add(new THREE.Vector3(0, T[b.type].h * PH, 0)), 10, false);
  anims.push({ mesh: b.mesh, t0: performance.now(), dur: 160, to: b.mesh.position.y, from: b.mesh.position.y + 0.25 });
  prog.painted++; if (!prog.colorsUsed.includes(state.color)) prog.colorsUsed.push(state.color);
  questEvent('paint', 1); questEvent('color', state.color);
  gainXp(2); checkAchs(); afterChange(false);
}
function applyOp(op, inverse) {
  if (op.op === 'paint') { const id = occ.get(key(op.d.x, op.d.y, op.d.z)); const b = id && bricks.get(id); if (b) recolor(b, inverse ? op.from : op.to); return; }
  const adding = (op.op === 'add') !== inverse;
  if (adding) addBrick(op.d, true); else { const id = occ.get(key(op.d.x, op.d.y, op.d.z)); if (id) removeBrick(id); }
}
function undo() { const op = undoStack.pop(); if (!op) return; applyOp(op, true); redoStack.push(op); sTick(); afterChange(false); }

}

}

/* ================= daily quests ================= */
function todayStr(off) { const d = new Date(); d.setDate(d.getDate() + (off || 0)); return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); }

function ensureDaily() {
  const today = todayStr();
  if (prog.daily && prog.daily.date === today) return false;
  const lv = levelInfo(prog.xp).l, rnd = seeded(today);
  const pool = QUEST_POOL.filter(q => !q.need || lv >= unlockLevel(q.need));
  const picks = [], evs = new Set();
  while (picks.length < 3 && pool.length) { const q = pool.splice(Math.floor(rnd() * pool.length), 1)[0]; if (evs.has(q.ev)) continue; evs.add(q.ev); picks.push({ id: q.id, n: 0, done: false }); }
  prog.daily = { date: today, quests: picks, colors: [], all: false };
  const first = !prog.lastDay;
  prog.streak = prog.lastDay === todayStr(-1) ? (prog.streak || 0) + 1 : 1;
  prog.lastDay = today;
  setTimeout(() => {
    if (prog.streak > 1) { const bonus = Math.min(200, 30 * prog.streak); sAch(); toast(String(prog.streak), `连续搭建第 ${prog.streak} 天`, `签到奖励 +${bonus} XP，今日任务已刷新`); gainXp(bonus); }
    else if (!first) toast('日', '今日任务已刷新', '完成 3 个任务还有额外奖励');
    checkAchs();
  }, 900);

}
function questEvent(ev, val) {

  prog.daily.quests.forEach(q => {
    const def = QUEST_POOL.find(x => x.id === q.id); if (!def || q.done || def.ev !== ev) return;
    if (def.set) { if (!prog.daily.colors.includes(val)) prog.daily.colors.push(val); q.n = prog.daily.colors.length; }
    else if (def.max) q.n = Math.max(q.n, val); else q.n += val;
    q.n = Math.min(q.n, def.goal); changed = true;
    if (q.n >= def.goal) { q.done = true; setTimeout(() => { sAch(); toast('✓', `任务完成：${def.text}`, `+${QUEST_XP} XP`); gainXp(QUEST_XP); }, 450); }
  });

    prog.daily.all = true; prog.dailyAllDone = (prog.dailyAllDone || 0) + 1;
    setTimeout(() => { sDone(); burst(controls.target.clone().add(new THREE.Vector3(0, 3, 0)), 100, true); toast('日', '今日任务全部完成', `额外 +${QUEST_ALL_XP} XP，明天还有新任务`); gainXp(QUEST_ALL_XP); checkAchs(); }, 1300);
  }

}

    return `<div class="quest${q.done ? ' done' : ''}"><div class="qrow"><span>${def.text}</span><span>${q.done ? '✓ +' + QUEST_XP : q.n + '/' + def.goal}</span></div><div class="bar"><b style="width:${q.n / def.goal * 100}%"></b></div></div>`;

}

  document.getElementById('doClear').onclick = () => { [...bricks.keys()].forEach(removeBrick); undoStack.length = 0; redoStack.length = 0; closeModal(); sRemove(); afterChange(false); };

/* ================= night ================= */
function applyNight(animateToast) {
  document.body.classList.toggle('night', prog.night);
  document.getElementById('tNight').classList.toggle('on', prog.night); document.getElementById('tNight').classList.add('alt');
  hemi.intensity = prog.night ? 0.1 : 0.3;
  sun.intensity = prog.night ? 0.22 : 1.5; sun.color.set(prog.night ? 0x9db4ff : 0xfff4e0);
  moonFill.intensity = prog.night ? 0.6 : 0;
  scene.fog.color.copy(lin(prog.night ? 0x1a2350 : 0xdff1ff));
  table.material.color.copy(lin(prog.night ? 0x2c3d33 : 0xb9d7a6));
  if (matCache.glow) matCache.glow.emissiveIntensity = prog.night ? 1.6 : 0.55;
  renderer.toneMappingExposure = prog.night ? 1.0 : 0.92;
  if (scene.environment) scene.traverse(o => { if (o.material && 'envMapIntensity' in o.material) o.material.envMapIntensity = prog.night ? 0.3 : (o.material === matCache.gold ? 1.4 : 0.6); });
}
(function stars() { const s = []; for (let i = 0; i < 140; i++) s.push(`${(Math.random() * 100).toFixed(1)}vw ${(Math.random() * 55).toFixed(1)}vh 0 ${Math.random() < 0.15 ? 1 : 0}px rgba(255,255,255,${(0.4 + Math.random() * 0.6).toFixed(2)})`); const d = document.createElement('i'); d.style.cssText = 'position:absolute;left:0;top:0;width:2px;height:2px;border-radius:50%;box-shadow:' + s.join(','); document.getElementById('stars').appendChild(d); })();

/* ================= input ================= */
const el = renderer.domElement;
let down = null;
function setMouse(e) { const r = el.getBoundingClientRect(); mouse.x = ((e.clientX - r.left) / r.width) * 2 - 1; mouse.y = -((e.clientY - r.top) / r.height) * 2 + 1; }
let hoverQueued = false;
el.addEventListener('pointermove', e => {
  pointerIn = true; setMouse(e);
  if (down && Math.hypot(e.clientX - down.x, e.clientY - down.y) > 6) down.moved = true;
  if (!hoverQueued) { hoverQueued = true; requestAnimationFrame(() => { hoverQueued = false; updateHover(); }); }
});
el.addEventListener('pointerleave', e => { if (e.pointerType === 'mouse') { pointerIn = false; updateHover(); } });
el.addEventListener('pointerdown', e => {
  audio();
  pointerIn = true; setMouse(e);
  down = { x: e.clientX, y: e.clientY, t: performance.now(), button: e.button, moved: false, id: e.pointerId, alt: e.altKey };
  if (e.pointerType !== 'mouse') updateHover();
});
window.addEventListener('pointerup', e => {
  if (!down || e.pointerId !== down.id) return;
  const d = down; down = null;
  if (e.target !== el || d.moved || performance.now() - d.t > 600) return;
  setMouse(e);
  if (d.alt) { eyedrop(); return; }
  if (d.button === 2 || state.mode === 'erase') { const hit = pick(); if (hit && hit.object !== baseplate) erase(hit.object.userData.id); return; }
  if (state.mode === 'paint') { const hit = pick(); if (hit && hit.object !== baseplate) paint(hit.object.userData.id); return; }
  if (d.button === 0) place();
  if (e.pointerType !== 'mouse') { setTimeout(() => { if (!down) { pointerIn = false; updateHover(); } }, 900); }
});
el.addEventListener('contextmenu', e => e.preventDefault());
controls.addEventListener('change', () => { if (pointerIn && !hoverQueued) { hoverQueued = true; requestAnimationFrame(() => { hoverQueued = false; updateHover(); }); } });

window.addEventListener('keydown', e => {
  if (!modal.hidden) { if (e.key === 'Escape') closeModal(); return; }
  const k = e.key.toLowerCase();
  if ((e.ctrlKey || e.metaKey) && k === 'z') { e.preventDefault(); e.shiftKey ? redo() : undo(); return; }
  if ((e.ctrlKey || e.metaKey) && k === 'y') { e.preventDefault(); redo(); return; }
  if (e.ctrlKey || e.metaKey || e.altKey) return;
  if (k === 'r') rotate();
  else if (k === 'e') setMode(state.mode === 'erase' ? 'build' : 'erase');
  else if (k === 'p') setMode(state.mode === 'paint' ? 'build' : 'paint');
  else if (k === 'b') toggleBp();
  else if (k === 'n') toggleNight();
  else if (k === 'm') toggleSound();
  else if (k === 'h' || k === '?') showHelp();
  else if (k === '[' || k === ']') {
    const lv = levelInfo(prog.xp).l; const list = COLORS.filter(c => lv >= unlockLevel(c.id));
    const i = list.findIndex(c => c.id === state.color); selectColor(list[(i + (k === ']' ? 1 : list.length - 1)) % list.length].id); sTick();
  } else if (/^[1-9]$/.test(k)) {
    const lv = levelInfo(prog.xp).l; const list = TYPES.filter(t => lv >= unlockLevel(t.id)); const t = list[+k - 1];
    if (t) { selectType(t.id); sTick(); }
  }
});
function toggleBp() { prog.bpShow = !prog.bpShow; document.getElementById('tBp').classList.toggle('on', prog.bpShow); document.getElementById('tBp').classList.add('alt'); refreshBlueprint(false); save(); }
function toggleNight() { prog.night = !prog.night; if (prog.night) prog.nightSeen = true; applyNight(); checkAchs(); save(); }
function toggleSound() { prog.muted = !prog.muted; document.getElementById('tSound').style.opacity = prog.muted ? 0.4 : 1; if (!prog.muted) sTick(); save(); }
function cycleBp(dir) { const i = BLUEPRINTS.findIndex(b => b.id === prog.bp); prog.bp = BLUEPRINTS[(i + dir + BLUEPRINTS.length) % BLUEPRINTS.length].id; if (!prog.bpShow) toggleBp(); refreshBlueprint(false); focusOn(bpCenter(curBp())); sTick(); save(); }
document.getElementById('tRotate').onclick = rotate;
document.getElementById('tErase').onclick = () => setMode(state.mode === 'erase' ? 'build' : 'erase');
document.getElementById('tPaint').onclick = () => setMode(state.mode === 'paint' ? 'build' : 'paint');
document.getElementById('qHead').onclick = () => { prog.questsOpen = document.getElementById('quests').classList.contains('closed'); renderQuests(); sTick(); scheduleSave(); };
document.getElementById('tUndo').onclick = undo;
document.getElementById('tRedo').onclick = redo;
document.getElementById('tBp').onclick = toggleBp;
document.getElementById('tNight').onclick = toggleNight;
document.getElementById('tSound').onclick = toggleSound;
document.getElementById('tHelp').onclick = showHelp;
document.getElementById('tClear').onclick = confirmClear;
document.getElementById('achBtn').onclick = showAchs;
document.getElementById('bpPrev').onclick = () => cycleBp(-1);
document.getElementById('bpNext').onclick = () => cycleBp(1);
window.addEventListener('resize', () => { camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix(); renderer.setSize(innerWidth, innerHeight); });

/* ================= boot ================= */
const SEED = [
  ['p44','green',0,8,0,-12],
  ['b11','brown',0,9,1,-11],['b11','brown',0,9,4,-11],['b11','brown',0,9,7,-11],
  ['p44','green',0,8,10,-12],['b22','green',0,8,11,-12],['b22','lime',0,10,11,-12],['b22','lime',0,8,11,-10],['b22','green',0,10,11,-10],
  ['b22','green',0,9,14,-11],['p11','red',0,9,17,-11],
  ['p24','white',0,10,0,8],['b12','red',0,10,1,8],['b12','red',0,12,1,8],['b12','red',0,10,1,9],['b12','red',0,12,1,9],
  ['s22','blue',1,11,4,8],['p11','yellow',0,10,1,10],['p11','yellow',0,13,1,10],
];
if (saved && Array.isArray(saved.bricks)) saved.bricks.forEach(a => { const d = { type: a[0], color: a[1], rot: a[2], x: a[3], y: a[4], z: a[5] }; if (T[d.type] && C[d.color] && fits(d.type, d.rot, d.x, d.y, d.z)) addBrick(d, false); });
else SEED.forEach(a => { const d = { type: a[0], color: a[1], rot: a[2], x: a[3], y: a[4], z: a[5] }; if (fits(d.type, d.rot, d.x, d.y, d.z)) addBrick(d, false); });

if (levelInfo(prog.xp).l < unlockLevel(state.type)) state.type = 'b24';
if (levelInfo(prog.xp).l < unlockLevel(state.color)) state.color = 'red';
refreshGhostLook(); buildTray(); applyNight();
document.getElementById('tBp').classList.toggle('on', prog.bpShow); document.getElementById('tBp').classList.add('alt');
document.getElementById('tSound').style.opacity = prog.muted ? 0.4 : 1;
ensureDaily(); renderQuests();
refreshBlueprint(false); refreshHud();
{ const c = bpCenter(curBp()); camera.position.add(c.clone().sub(controls.target)); controls.target.copy(c); controls.update(); }

if (!prog.tipDone) {
  const touch = matchMedia('(pointer: coarse)').matches;
  tip.innerHTML = touch
    ? '<b>轻点</b>放积木，<b>单指</b>转视角，<b>双指</b>缩放。<br>先把中间的<b>蓝色虚影</b>填满吧。<br><button id="tipOk">知道了</button>'
    : '<b>点击</b>放积木，<b>拖动</b>转视角，<b>右键</b>拆除，<b>R</b> 旋转。<br>先把中间的<b>蓝色虚影</b>填满吧。<br><button id="tipOk">知道了</button>';
  tip.hidden = false;
  document.getElementById('tipOk').onclick = () => { tip.hidden = true; prog.tipDone = true; save(); };
}

/* ================= loop ================= */
const clock = new THREE.Clock();
const easeOutBack = x => { const c1 = 1.9, c3 = c1 + 1; return 1 + c3 * Math.pow(x - 1, 3) + c1 * Math.pow(x - 1, 2); };
function loop() {
  const dt = Math.min(clock.getDelta(), 0.05); const now = performance.now();
  if (focus) {
    const p = Math.min(1, (now - focus.t0) / 750), e = 1 - Math.pow(1 - p, 3);
    const nt = focus.from.clone().lerp(focus.to, e); camera.position.add(nt.clone().sub(controls.target)); controls.target.copy(nt);
    if (p >= 1) focus = null;
  }
  controls.update();
  for (let i = anims.length - 1; i >= 0; i--) {
    const a = anims[i]; const p = Math.min(1, (now - a.t0) / a.dur);
    a.mesh.position.y = a.from + (a.to - a.from) * easeOutBack(p);
    if (p >= 1) { a.mesh.position.y = a.to; anims.splice(i, 1); }
  }
  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i]; p.life -= dt;
    p.v.y -= 18 * dt; p.m.position.addScaledVector(p.v, dt);
    p.m.rotation.x += p.spin.x * dt; p.m.rotation.y += p.spin.y * dt;
    if (p.m.position.y < 0.02) { p.m.position.y = 0.02; p.v.multiplyScalar(0.4); p.v.y = Math.abs(p.v.y) * 0.3; }
    if (p.life <= 0) { scene.remove(p.m); particles.splice(i, 1); }
  }
  const pulse = 0.5 + 0.5 * Math.sin(now / 380);
  bpMatNow.opacity = 0.22 + 0.22 * pulse;
  if (ghost.material === ghostMat) ghostMat.opacity = 0.42 + 0.18 * pulse;
  renderer.render(scene, camera);
  requestAnimationFrame(loop);
}
loop();
})();
